apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly-kafka
  labels:
    app.kubernetes.io/name: wildfly-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wildfly-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wildfly-kafka
    spec:
      containers:
        - name: wildfly
          image: wildfly-kafka-sample:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wildfly-kafka-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10

