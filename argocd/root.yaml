apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jbossqueues
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/h4rkon/jbossqueues.git
    targetRevision: HEAD
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

