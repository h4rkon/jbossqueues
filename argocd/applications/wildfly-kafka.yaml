apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wildfly-kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/h4rkon/jbossqueues.git
    targetRevision: HEAD
    path: apps/wildfly-kafka/overlays/local-colima
  destination:
    server: https://kubernetes.default.svc
    namespace: jbossqueues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

